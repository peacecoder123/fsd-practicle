<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="form-container">
  <h2>Student Registration</h2>
  <form>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" placeholder="Enter your name" required minlength="3">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" placeholder="Min 6 characters" required minlength="6">
    </div>
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" placeholder="10-digit phone number" pattern="[0-9]{10}" required>
    </div>
    <div class="form-group">
      <label>Gender</label>
      <div class="radio-group">
        <label><input type="radio" name="gender" value="male" required> Male</label>
        <label><input type="radio" name="gender" value="female"> Female</label>
        <label><input type="radio" name="gender" value="other"> Other</label>
      </div>
    </div>
    <div class="form-group">
      <label>Course</label>
      <select required>
        <option value="">Select Course</option>
        <option>B.E. Computer Science</option>
        <option>B.E. Information Technology</option>
        <option>B.E. Electronics</option>
        <option>B.Sc. Computer Science</option>
        <option>BCA</option>
      </select>
    </div>
    <div class="btn-group">
      <button type="submit" class="btn-submit">Register</button>
      <button type="reset" class="btn-reset">Reset</button>
    </div>
  </form>
</div>
</body>
</html>
