<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grade Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h2>Marks & Grade Calculator</h2>
  <div class="form-group">
    <label>Student Name</label>
    <input type="text" id="name" placeholder="Enter name">
  </div>
  <div class="form-group"><label>Subject 1 (out of 100)</label><input type="number" id="s1" min="0" max="100" placeholder="0–100"></div>
  <div class="form-group"><label>Subject 2 (out of 100)</label><input type="number" id="s2" min="0" max="100" placeholder="0–100"></div>
  <div class="form-group"><label>Subject 3 (out of 100)</label><input type="number" id="s3" min="0" max="100" placeholder="0–100"></div>
  <div class="form-group"><label>Subject 4 (out of 100)</label><input type="number" id="s4" min="0" max="100" placeholder="0–100"></div>
  <div class="form-group"><label>Subject 5 (out of 100)</label><input type="number" id="s5" min="0" max="100" placeholder="0–100"></div>
  <button onclick="calculate()">Calculate</button>
  <div id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
